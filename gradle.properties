pluginGroup = dev.nocloud.ai
pluginName = No Cloud AI
pluginVersion = 0.1.0

# Target the WebStorm platform so JavaScript/TypeScript PSI APIs are available.
# The JavaScript dependency is declared optional in plugin.xml, so the plugin
# still loads in IDEs that do not ship the JavaScript plugin.
platformType = WS
platformVersion = 2026.1

# 2026.1 = build 261
pluginSinceBuild = 261
pluginUntilBuild = 262.*

javaVersion = 21
gradleVersion = 8.13

kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true

kotlin.daemon.jvmargs = -Xmx2g
